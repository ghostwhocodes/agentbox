[package]
name = "agentbox"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Nos Doughty"]
description = "Workspace-local context manager for independent git repos"
documentation = "https://github.com/llaith/agentbox#readme"
homepage = "https://github.com/llaith/agentbox"
repository = "https://github.com/llaith/agentbox"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "USAGE.md",
    "src/**",
    "tests/**",
]

[features]
default = []
privileged-tests = []

[lib]
name = "agentbox"
path = "src/lib.rs"

[[bin]]
name = "agentbox"
path = "src/main.rs"

[[test]]
name = "privileged_bind_mount"
path = "tests/privileged_bind_mount.rs"
required-features = ["privileged-tests"]

[dependencies]
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.5.60", features = ["derive"] }
nix = { version = "0.29.0", features = ["mount", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
toml = "0.8.23"
